services:
  - type: web
    name: templex-backend
    env: python
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt && python main.py --seed"
    startCommand: "uvicorn api.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: INDIANKANOON_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
