services:
  - type: web
    name: templex-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python main.py --seed"
    startCommand: "uvicorn api.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: COURTLISTENER_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: templex-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: templex-frontend
    env: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: templex-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
